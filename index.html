<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7f8" />
    <title>Razones para amarte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="heart-trail" aria-hidden="true"></div>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Una pequeña colección de motivos</p>
        <h1>Razones para amarte</h1>
        <p class="intro">Abre cada tarjeta y descubre algo que hace especial nuestro amor.</p>
        <div class="progress" aria-live="polite">
          <span id="progress-text">0 de 0 tarjetas abiertas</span>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
        </div>
      </header>

      <section id="cards" class="cards-grid" aria-label="Razones para amarte"></section>

      <section id="celebration" class="celebration" aria-live="polite" aria-hidden="true">
        <div class="photo-collage" aria-hidden="true">
          <div class="photo-placeholder photo-one" role="img" aria-label="Un recuerdo juntos"></div>
          <div class="photo-placeholder photo-two" role="img" aria-label="Otro recuerdo juntos"></div>
          <div class="photo-placeholder photo-three" role="img" aria-label="Un recuerdo especial juntos"></div>
        </div>
        <div class="heart" role="img" aria-label="Un corazón"></div>
        <div class="spotify-player">
          <iframe
            src="https://open.spotify.com/embed/track/4rzqsW1SsHF78cQNmwsBAe?utm_source=generator&theme=0&autoplay=1"
            title="Canción especial en Spotify"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="eager"
          ></iframe>
        </div>
        <p id="final-message" class="final-message">Feliz 2 meses, mi amor</p>
        <p class="celebration-caption">Gracias por hacer mis días más bonitos.</p>
      </section>
    </main>

    <template id="card-template">
      <button class="reason-card" type="button">
        <span class="card-number" aria-hidden="true"></span>
        <span class="card-front">Haz clic para descubrirlo <span class="arrow">↗</span></span>
        <span class="card-back"></span>
      </button>
    </template>

    <script src="script.js" defer></script>
  </body>
</html>
